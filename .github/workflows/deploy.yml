name: Deploy

# develop -> staging Supabase project
# main    -> production Supabase project (manual approval), then the web app on Vercel
on:
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.122.1
  NODE_VERSION: 22
  VERCEL_CLI_VERSION: 59.11.7

jobs:
  staging:
    name: Migrate staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    # Only one deploy per environment at a time; a queued deploy waits instead of cancelling a running one.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run
      # db push applies migrations only; seed.sql is never pushed to a hosted project.
      - name: Apply migrations
        run: supabase db push

  production:
    name: Migrate production and deploy web app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The production environment requires a reviewer's approval before this job starts.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run
      - name: Apply migrations
        run: supabase db push

      # The web app ships only after the migrations above succeeded (steps run in order and stop on failure).
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pull Vercel production settings
        run: npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build web app
        run: npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy web app to production
        run: npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
